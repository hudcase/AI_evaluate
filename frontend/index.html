<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>培训教学质量评估系统 · 控制台</title>
<meta name="description" content="基于双模态音视频分析的培训教学质量评估系统 端侧控制台">
<!-- 内联图标，避免 file:// 与静态服务下 favicon.ico 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E4FA8'/%3E%3Ctext x='32' y='43' font-family='Helvetica,Arial,sans-serif' font-size='28' font-weight='700' fill='%23fff' text-anchor='middle'%3EAE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">AE</div>
      <div class="brand-text">
        <strong>教学质量评估</strong>
        <span>端侧控制台 v0.1</span>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-foot">
      <div class="edge-note">
        <span class="dot dot-onsite"></span>端侧主机 · 原片不出校
      </div>
      <div class="edge-note">
        <span class="dot dot-cloud"></span>云端模型 · 经 M4 网关
      </div>
    </div>
  </aside>

  <div class="main">

    <header class="topbar">
      <div class="topbar-left">
        <h1 id="page-title">总览</h1>
      </div>
      <div class="topbar-right">
        <div class="session-picker">
          <label for="session-select">当前场次</label>
          <select id="session-select"></select>
        </div>
        <div class="env-badge" id="env-badge" title="数据来源">演示数据</div>
      </div>
    </header>

    <main class="content" id="view" aria-live="polite"></main>

    <footer class="footer">
      <span>双模态 21 条指标 · 音频 9 项计分 ／ 视频 10 项计分 · 分项分与模态分同为百分制</span>
      <span id="footer-time"></span>
    </footer>

  </div>

</div>

<div class="toast-host" id="toast-host"></div>
<div class="modal-host" id="modal-host"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/mock.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/desktop.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/router.js"></script>
<script src="assets/js/views/overview.js"></script>
<script src="assets/js/views/courses.js"></script>
<script src="assets/js/views/media.js"></script>
<script src="assets/js/views/governance.js"></script>
<script src="assets/js/views/gateway.js"></script>
<script src="assets/js/views/indicators.js"></script>
<script src="assets/js/views/evaluation.js"></script>
<script src="assets/js/views/report.js"></script>
<script src="assets/js/views/config.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
